<h1 class="page-title">Join Us - Event Coordinator Application</h1>

<form id="joinForm" method="POST" action="https://formspree.io/f/xandglke">
  <label for="name">Full Name<span style="color: red;">*</span></label><br />
  <input type="text" id="name" name="name" required placeholder="Your full name" /><br /><br />

  <label for="programBatch">Program and Batch<span style="color: red;">*</span></label><br />
  <input type="text" id="programBatch" name="programBatch" required placeholder="e.g. MBA Project Management, Batch 2024" /><br /><br />

  <label for="studentNumber">Student Number<span style="color: red;">*</span></label><br />
  <input type="text" id="studentNumber" name="studentNumber" pattern="\d{8}" title="Student number must be exactly 8 digits" required placeholder="8 digit student number" /><br /><br />

  <label for="email">Email Address<span style="color: red;">*</span></label><br />
  <input type="email" id="email" name="email" required placeholder="you@example.com" /><br /><br />

  <label for="whyJoin">Why do you want to join?<span style="color: red;">*</span></label><br />
  <textarea id="whyJoin" name="whyJoin" rows="5" required placeholder="Write your motivation here..."></textarea><br /><br />

  <button type="submit">Submit Application</button>
</form>

<div id="formMessage" style="max-width: 480px; margin: 1rem auto; font-weight: 600; text-align: center;"></div>

<style>
  form {
    max-width: 480px;
    margin: 2rem auto;
    font-family: Arial, sans-serif;
  }
  label {
    font-weight: 600;
  }
  input, textarea {
    width: 100%;
    padding: 0.5rem 0.6rem;
    margin-top: 0.3rem;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 1rem;
    box-sizing: border-box;
  }
  button {
    background-color: #3a3a6e;
    color: white;
    border: none;
    padding: 0.75rem 1.5rem;
    font-size: 1rem;
    border-radius: 8px;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }
  button:hover {
    background-color: #2e2e55;
  }
  #formMessage.success {
    color: green;
  }
  #formMessage.error {
    color: red;
  }
</style>

<script>
  const form = document.getElementById('joinForm');
  const messageDiv = document.getElementById('formMessage');

  form.addEventListener('submit', function(event) {
    event.preventDefault();

    const studentNumber = document.getElementById('studentNumber').value;
    const email = document.getElementById('email').value;

    const studentNumberPattern = /^\d{8}$/;
    if (!studentNumberPattern.test(studentNumber)) {
      showMessage('Student number must be exactly 8 digits.', 'error');
      return;
    }

    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailPattern.test(email)) {
      showMessage('Please enter a valid email address.', 'error');
      return;
    }

    // Prepare form data
    const formData = new FormData(form);

    // Submit form data using fetch to Formspree
    fetch(form.action, {
      method: 'POST',
      body: formData,
      headers: {
        'Accept': 'application/json'
      }
    })
    .then(response => {
      if (response.ok) {
        form.reset();
        showMessage('Thank you! Your application has been submitted successfully.', 'success');
      } else {
        response.json().then(data => {
          if (data && data.errors) {
            showMessage(data.errors.map(error => error.message).join(", "), 'error');
          } else {
            showMessage('Oops! There was a problem submitting your form.', 'error');
          }
        });
      }
    })
    .catch(() => {
      showMessage('Oops! There was a problem submitting your form.', 'error');
    });
  });

  function showMessage(msg, type) {
    messageDiv.textContent = msg;
    messageDiv.className = type;
  }
</script>
