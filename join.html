<h1>Upload an Image For the End Sem Bash Party</h1>

<input type="file" id="fileInput" multiple accept="image/*">
<button onclick="uploadFile()">Upload</button>

<p id="status"></p>
<p id="preview"></p>

<script>
  async function uploadFile() {
    const fileInput = document.getElementById('fileInput');
    const status = document.getElementById('status');
    const preview = document.getElementById('preview');

    if (!fileInput.files.length) {
      status.innerText = 'Please select a file.';
      return;
    }

    const file = fileInput.files[0];
    const reader = new FileReader();

    reader.onload = async function(e) {
      const base64String = e.target.result.split(',')[1];

      const formData = new URLSearchParams();
      formData.append('file', base64String);
      formData.append('filename', file.name);
      formData.append('mimeType', file.type);

      try {
        status.innerText = 'Uploading...   This might take a few seconds...';

        const response = await fetch('https://script.google.com/macros/s/AKfycbwvy1G0pZ33Roz9oRjzO_FtcVFC7m36Re2uAKqrInq-oUIOgZx3vmyc-bjiOp4ggX8xig/exec', {
          method: 'POST',
          body: formData
        });

        const result = await response.json();

        if (result.status === 'success') {
          status.innerText = 'Upload successful!';
          preview.innerHTML = `<a href="${result.fileUrl}" target="_blank">View uploaded image</a>`;
        } else {
          status.innerText = 'Upload failed: ' + result.message;
        }
      } catch (error) {
        status.innerText = 'Error uploading file: ' + error.message;
      }
    };

    reader.readAsDataURL(file);
  }
</script>
