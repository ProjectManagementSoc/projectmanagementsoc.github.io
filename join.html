---
layout: default
title: Join Us
---

<section id="image-upload">
  <h2>Upload Your Image</h2>

  <div class="upload-box">
    <input type="file" id="uploadInput" accept="image/*">
    <button onclick="uploadToDrive()" class="upload-btn">Upload Image</button>

    <div id="progress-container">
      <div id="progress-bar"><span id="progress-text">0%</span></div>
    </div>

    <div id="upload-message"></div>
  </div>
</section>

<script>
  function uploadToDrive() {
    const input = document.getElementById('uploadInput');
    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');
    const uploadMsg = document.getElementById('upload-message');

    uploadMsg.textContent = '';
    progressBar.style.width = '0%';
    progressText.textContent = '0%';

    if (!input.files.length) {
      alert('Please select an image.');
      return;
    }

    const file = input.files[0];

    if (file.size > 30 * 1024 * 1024) {
      alert('File is too large! Maximum size allowed is 30 MB.');
      return;
    }

    const reader = new FileReader();

    reader.onloadstart = function () {
      document.getElementById('progress-container').style.display = 'block';
    };

    reader.onloadend = function (e) {
      const base64 = e.target.result.split(',')[1];

      const params = new URLSearchParams({
        filename: file.name,
        mimeType: file.type,
        file: base64
      });

      const xhr = new XMLHttpRequest();

      xhr.open("POST", "https://script.google.com/macros/s/AKfycbybxyWiWsvNQTSGh4hWmLEh64aovUjmPJ96t1Uky05brAnn1kQaFTPZCSgp8zdVOwhR/exec");

      xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");

      xhr.upload.onprogress = function (event) {
        if (event.lengthComputable) {
          const percentComplete = Math.round((event.loaded / event.total) * 100);
          progressBar.style.width = percentComplete + '%';
          progressText.textContent = percentComplete + '%';
        }
      };

      xhr.onload = function () {
        if (xhr.status === 200) {
          try {
            const result = JSON.parse(xhr.responseText);
            if (result.status === 'success') {
              progressBar.style.width = '100%';
              progressText.textContent = '100%';
              uploadMsg.innerHTML = `<div class="popup">✅ Upload successful! <br><a href="${result.fileUrl}" target="_blank">View File</a></div>`;
            } else {
              uploadMsg.innerHTML = `<div class="popup error">❌ Upload failed: ${result.message}</div>`;
            }
          } catch {
            uploadMsg.innerHTML = `<div class="popup error">❌ Unexpected response from server</div>`;
          }
        } else {
          uploadMsg.innerHTML = `<div class="popup error">❌ Upload failed with status ${xhr.status}</div>`;
        }

        setTimeout(() => {
          document.getElementById('progress-container').style.display = 'none';
        }, 4000);
      };

      xhr.onerror = function () {
        uploadMsg.innerHTML = `<div class="popup error">❌ Upload failed due to a network error.</div>`;
        document.getElementById('progress-container').style.display = 'none';
      };

      xhr.send(params.toString());
    };

    reader.readAsDataURL(file);
  }
</script>

<style>
  #progress-container {
    margin-top: 20px;
    width: 100%;
    height: 25px;
    border-radius: 20px;
    background: #1c1f2b;
    overflow: hidden;
    box-shadow: 0 0 10px #00f0ff33, 0 0 20px #00f0ff22 inset;
    position: relative;
    display: none;
  }

  #progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #00f0ff, #0ff, #00ffd5);
    background-size: 200% 100%;
    animation: glowProgress 2s linear infinite;
    border-radius: 20px 0 0 20px;
    transition: width 0.3s ease-in-out;
    position: relative;
  }

  @keyframes glowProgress {
    0% {
      background-position: 0% 0%;
    }
    100% {
      background-position: 200% 0%;
    }
  }

  #progress-text {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-weight: bold;
    font-family: 'Courier New', monospace;
    font-size: 0.9rem;
    line-height: 25px;
    text-shadow: 0 0 5px #00f0ff;
  }
</style>
