layout: default
title: Join Us
---

<h1>Upload an Image For the End Sem Bash Party</h1>

<input type="file" id="fileInput" accept="image/*" style="display: none;">
<button id="uploadButton">Upload</button>

<p id="status" style="display: none;"></p>
<p id="preview"></p>

<script>
  document.getElementById('uploadButton').addEventListener('click', () => {
    document.getElementById('fileInput').click();
  });

  async function uploadFile() {
    const fileInput = document.getElementById('fileInput');
    const status = document.getElementById('status');
    const preview = document.getElementById('preview');

    if (!fileInput.files.length) {
      status.innerText = 'Please select a file.';
      status.style.display = 'block';  // Show the status
      return;
    }

    const file = fileInput.files[0];
    const reader = new FileReader();

    reader.onload = async function(e) {
      const base64String = e.target.result.split(',')[1];

      const formData = new URLSearchParams();
      formData.append('file', base64String);
      formData.append('filename', file.name);
      formData.append('mimeType', file.type);

      try {
        status.innerText = 'Uploading...';
        status.style.display = 'block';  // Show the status

        const response = await fetch('https://script.google.com/macros/s/AKfycbwvy1G0pZ33Roz9oRjzO_FtcVFC7m36Re2uAKqrInq-oUIOgZx3vmyc-bjiOp4ggX8xig/exec', {
          method: 'POST',
          body: formData
        });

        const result = await response.json();

        if (result.status === 'success') {
          status.innerText = 'Upload successful!';
          preview.innerHTML = `<a href="${result.fileUrl}" target="_blank">View uploaded image</a>`;
        } else {
          status.innerText = 'Upload failed: ' + result.message;
        }
      } catch (error) {
        status.innerText = 'Error uploading file: ' + error.message;
      }
    };

    reader.readAsDataURL(file);
  }
</script>

<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 20px;
    background-color: #f4f7fc;
  }

  h1 {
    font-size: 24px;
    color: #333;
    margin-bottom: 20px;
  }

  #fileInput {
    display: none;
  }

  #uploadButton {
    background: linear-gradient(45deg, #ff4e00, #ff7a00);
    color: white;
    border: 2px solid #ff4e00;
    padding: 15px 30px;
    font-size: 16px;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 5px 15px rgba(255, 80, 0, 0.2);
  }

  #uploadButton:hover {
    background: linear-gradient(45deg, #ff7a00, #ff4e00);
    transform: translateY(-3px);
    box-shadow: 0 10px 20px rgba(255, 80, 0, 0.3);
  }

  #uploadButton:active {
    transform: translateY(0);
    box-shadow: 0 5px 15px rgba(255, 80, 0, 0.2);
  }

  #status {
    margin-top: 20px;
    font-size: 18px;
    color: #333;
    visibility: visible;
    display: block;  /* Ensure status is shown by default */
    padding: 10px;
    background-color: rgba(0, 0, 0, 0.1);
    border-radius: 5px;
  }

  #preview a {
    font-size: 16px;
    color: #ff4e00;
    text-decoration: none;
  }

  #preview a:hover {
    text-decoration: underline;
  }
</style>
