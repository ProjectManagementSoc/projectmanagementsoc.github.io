<h1>Upload an Image For the End Sem Bash Party</h1>

<input type="file" id="fileInput" multiple accept="image/*">
<button onclick="uploadFile()">Upload</button>

<p id="status"></p>
<p id="preview"></p>

<script>
  async function uploadFile() {
    const fileInput = document.getElementById('fileInput');
    const status = document.getElementById('status');
    const preview = document.getElementById('preview');

    if (!fileInput.files.length) {
      status.innerText = 'Please select a file.';
      return;
    }

    status.innerText = 'Uploading...   This might take a few seconds...';
    preview.innerHTML = '';

    for (const file of fileInput.files) {
      const reader = new FileReader();

      reader.onload = async function(e) {
        const base64String = e.target.result.split(',')[1];

        const formData = new URLSearchParams();
        formData.append('file', base64String);
        formData.append('filename', file.name);
        formData.append('mimeType', file.type);

        try {
          const response = await fetch('https://script.google.com/macros/s/AKfycbwvy1G0pZ33Roz9oRjzO_FtcVFC7m36Re2uAKqrInq-oUIOgZx3vmyc-bjiOp4ggX8xig/exec', {
            method: 'POST',
            body: formData
          });

          const result = await response.json();

          if (result.status === 'success') {
            const link = document.createElement('a');
            link.href = result.fileUrl;
            link.target = '_blank';
            link.innerText = `View uploaded image: ${file.name}`;
            preview.appendChild(link);
            preview.appendChild(document.createElement('br'));
          } else {
            const errorMsg = document.createElement('p');
            errorMsg.innerText = 'Upload failed: ' + result.message;
            preview.appendChild(errorMsg);
          }
        } catch (error) {
          const errorMsg = document.createElement('p');
          errorMsg.innerText = 'Error uploading file: ' + error.message;
          preview.appendChild(errorMsg);
        }
      };

      reader.readAsDataURL(file);
  
    status.innerText = 'Upload process completed.';
  }
}
</script>
