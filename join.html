<h1 class="page-title">Join Us - Event Coordinator Application</h1>

<form id="joinForm" method="POST" action="https://formspree.io/f/xandglke" autocomplete="off" novalidate>
  <label for="name">Full Name<span>*</span></label>
  <input type="text" id="name" name="name" required placeholder="Your full name" autocomplete="name" />

  <label for="programBatch">Program and Batch<span>*</span></label>
  <input type="text" id="programBatch" name="programBatch" required placeholder="e.g. MBA Project Management, Sept 2025" />

  <label for="studentNumber">Student Number<span>*</span></label>
  <input type="text" id="studentNumber" name="studentNumber" pattern="\d{8}" title="Student number must be exactly 8 digits" required placeholder="8 digit student number" maxlength="8" inputmode="numeric" />

  <label for="email">Email Address<span>*</span></label>
  <input type="email" id="email" name="email" required placeholder="studentNumber@dbs.ie" autocomplete="email" />

  <label for="whyJoin">Why do you want to join?<span>*</span></label>
  <textarea id="whyJoin" name="whyJoin" rows="5" required placeholder="Write your motivation here..."></textarea>

  <button type="submit">Submit Application</button>
</form>

<div id="formMessage" aria-live="polite"></div>

<script>
  const form = document.getElementById('joinForm');
  const messageDiv = document.getElementById('formMessage');

  form.addEventListener('submit', function(event) {
    event.preventDefault();

    const studentNumber = document.getElementById('studentNumber').value.trim();
    const email = document.getElementById('email').value.trim();

    const studentNumberPattern = /^\d{8}$/;
    if (!studentNumberPattern.test(studentNumber)) {
      showMessage('Student number must be exactly 8 digits.', 'error');
      return;
    }

    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailPattern.test(email)) {
      showMessage('Please enter a valid email address.', 'error');
      return;
    }

    const formData = new FormData(form);

    fetch(form.action, {
      method: 'POST',
      body: formData,
      headers: {
        'Accept': 'application/json'
      }
    })
    .then(response => {
      if (response.ok) {
        form.reset();
        showMessage('Thank you! Your application has been submitted successfully.', 'success');
      } else {
        response.json().then(data => {
          if (data && data.errors) {
            showMessage(data.errors.map(error => error.message).join(", "), 'error');
          } else {
            showMessage('Oops! There was a problem submitting your form.', 'error');
          }
        });
      }
    })
    .catch(() => {
      showMessage('Oops! There was a problem submitting your form.', 'error');
    });
  });

  function showMessage(msg, type) {
    messageDiv.textContent = msg;
    messageDiv.className = type;
  }
</script>
