---
layout: default
title: Join Us
---

<main class="container" role="main" aria-label="Join Form">
  <h1 class="section-title">Join the Project Management Club</h1>

  <form action="https://formspree.io/f/xandglke" method="POST" id="join-form">
    <label for="name">Full Name <sup>*</sup></label>
    <input type="text" id="name" name="name" required placeholder="Your full name" />

    <label for="studentNumber">Student Number <sup>*</sup></label>
    <input type="text" id="studentNumber" name="studentNumber" pattern="\d{8}" title="Student number must be exactly 8 digits" required placeholder="8-digit student number" maxlength="8" inputmode="numeric" />

    <label for="programBatch">Program and Batch <sup>*</sup></label>
    <input type="text" id="programBatch" name="programBatch" required placeholder="e.g. MBA Project Management, Sept 2025" />

    <label for="email">Email Address <sup>*</sup></label>
    <input type="email" id="email" name="email" required placeholder="studentNumber@dbs.ie" />

    <label for="message">Why do you want to join? <sup>*</sup></label>
    <textarea id="message" name="message" required placeholder="Write your motivation..."></textarea>

    <!-- spam trap -->
    <input type="text" name="_gotcha" style="display:none" />

    <button type="submit">Send Message</button>
    <p class="form-note">Fields marked with <sup>*</sup> are required.</p>
  </form>

  <div class="success-message" id="successMessage" style="display:none;">
    ✅ Thanks! Your message has been sent.
  </div>
  <div class="error-message" id="errorMessage" style="display:none;">
    ❌ Oops! Something went wrong. Please try again.
  </div>
</main>

<style>
  .container {
    max-width: 700px;
    margin: 3rem auto;
    padding: 1.5rem;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 12px 30px rgba(30, 60, 120, 0.06);
  }

  .section-title {
    text-align: center;
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 2rem;
    color: #1a1a2e;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  label {
    font-weight: bold;
    color: #333;
  }

  input, textarea {
    padding: 0.75rem;
    border: 1.5px solid #ccc;
    border-radius: 8px;
    font-size: 1rem;
    width: 100%;
  }

  button[type="submit"] {
    background-color: #4158d0;
    color: #fff;
    border: none;
    padding: 0.9rem 1.5rem;
    border-radius: 10px;
    font-size: 1.1rem;
    cursor: pointer;
    transition: background-color 0.3s ease;
    align-self: flex-start;
  }

  button[type="submit"]:hover {
    background-color: #2f40b5;
  }

  .form-note {
    font-size: 0.9rem;
    text-align: center;
    color: #777;
  }

  .success-message,
  .error-message {
    margin-top: 1rem;
    font-size: 1rem;
    padding: 1rem;
    border-radius: 8px;
    text-align: center;
  }

  .success-message {
    background: #e8ffe8;
    color: #2e7d32;
    border: 1px solid #a5d6a7;
  }

  .error-message {
    background: #ffe8e8;
    color: #c62828;
    border: 1px solid #ef9a9a;
  }
</style>

<script>
  document.getElementById("join-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    const form = e.target;
    const data = new FormData(form);
    try {
      const res = await fetch(form.action, {
        method: form.method,
        body: data,
        headers: { 'Accept': 'application/json' }
      });
      if (res.ok) {
        form.reset();
        document.getElementById("successMessage").style.display = "block";
        document.getElementById("errorMessage").style.display = "none";
      } else {
        throw new Error("Submission failed");
      }
    } catch (err) {
      document.getElementById("successMessage").style.display = "none";
      document.getElementById("errorMessage").style.display = "block";
    }
  });
</script>
