<!-- Place this inside your Jekyll page layout or page -->
<div class="upload-container">
  <input type="file" id="fileUpload" accept="image/*" hidden>
  <label for="fileUpload" class="upload-button">
    <span id="uploadText">🚀 Upload Image</span>
  </label>
  <div id="uploadStatus" class="status-message"></div>
</div>

<style>
.upload-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: 3rem;
  font-family: 'Orbitron', sans-serif;
}

.upload-button {
  background: rgba(0, 255, 255, 0.1);
  border: 2px solid cyan;
  color: cyan;
  padding: 1rem 2rem;
  border-radius: 12px;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-size: 1.2rem;
  transition: all 0.3s ease;
  backdrop-filter: blur(10px);
  box-shadow: 0 0 20px cyan;
}

.upload-button:hover {
  background: cyan;
  color: black;
  box-shadow: 0 0 30px cyan;
}

.status-message {
  margin-top: 1rem;
  font-size: 1rem;
  color: white;
}
</style>

<script>
function doPost(e) {
  try {
    var folder = DriveApp.getFolderById("1xkMyXcC7mHooYgYXiRlCTxnolZLTi_7L"); // Replace with a real folder ID
    var blob = e.parameter.file; // Wrong! Will not work with multipart/form-data

    // Fix: use this instead
    var fileBlob = e.postData.getBlob();
    var file = folder.createFile(fileBlob);
    return ContentService
      .createTextOutput(JSON.stringify({ url: file.getUrl() }))
      .setMimeType(ContentService.MimeType.JSON);
  } catch (f) {
    return ContentService
      .createTextOutput(JSON.stringify({ error: f.toString() }))
      .setMimeType(ContentService.MimeType.JSON);
  }
}

</script>
