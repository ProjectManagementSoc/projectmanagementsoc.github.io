<!-- Image Upload Button: Futuristic Style -->
<div class="upload-container">
  <label for="file-upload" class="upload-button">
    <span>🚀 Upload Image</span>
  </label>
  <input id="file-upload" type="file" accept="image/*" style="display: none;" />
  <div id="upload-status"></div>
</div>

<style>
.upload-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin: 50px auto;
  font-family: 'Orbitron', sans-serif;
  max-width: 400px;
}

.upload-button {
  background: linear-gradient(135deg, #00f5a0, #00d9f5);
  border: none;
  color: #fff;
  padding: 16px 30px;
  font-size: 18px;
  border-radius: 12px;
  cursor: pointer;
  box-shadow: 0 0 15px #00f5a0;
  transition: all 0.3s ease;
  animation: pulse 2s infinite;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.upload-button:hover {
  transform: scale(1.05);
  box-shadow: 0 0 25px #00f5a0;
}

@keyframes pulse {
  0% { box-shadow: 0 0 15px #00f5a0; }
  50% { box-shadow: 0 0 25px #00d9f5; }
  100% { box-shadow: 0 0 15px #00f5a0; }
}

#upload-status {
  margin-top: 20px;
  font-size: 14px;
  color: #ffffffcc;
  text-align: center;
}
</style>

<script>
document.getElementById('file-upload').addEventListener('change', function () {
  const file = this.files[0];
  const statusDiv = document.getElementById('upload-status');
  statusDiv.innerHTML = '';

  if (!file) return;

  if (file.size > 15 * 1024 * 1024) {
    statusDiv.innerHTML = "❌ File is too large. Max 15MB.";
    return;
  }

  const formData = new FormData();
  formData.append('file', file);

  statusDiv.innerHTML = "⏳ Uploading...";

  fetch("https://script.google.com/macros/s/AKfycbwvy1G0pZ33Roz9oRjzO_FtcVFC7m36Re2uAKqrInq-oUIOgZx3vmyc-bjiOp4ggX8xig/exec", {
    method: 'POST',
    body: formData
  })
  .then(res => res.json())
  .then(data => {
    if (data?.url) {
      statusDiv.innerHTML = `✅ Uploaded! <a href="${data.url}" target="_blank" style="color: #00f5a0;">View Image</a>`;
    } else {
      throw new Error("Upload failed.");
    }
  })
  .catch(err => {
    console.error(err);
    statusDiv.innerHTML = "❌ Upload failed.";
  });
});
</script>

<!-- Include Google Font for Futuristic Look -->
