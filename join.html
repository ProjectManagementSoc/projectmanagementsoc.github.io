<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project Management Club - Contact Form</title>

  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f7f9ff;
      color: #2b2b40;
      line-height: 1.6;
    }

    h1, h2, h3, h4 {
      color: #1a1a2e;
      margin-top: 0;
    }

    a {
      color: #2f52e0;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .container {
      max-width: 700px;
      margin: 3rem auto 5rem;
      padding: 1rem 1.5rem;
      background: white;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(30, 60, 120, 0.06);
    }

    .section-title {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 2rem;
      color: #1a1a2e;
      border-bottom: 3px solid #4158d0;
      display: inline-block;
      padding-bottom: 0.3rem;
      text-align: center;
      width: 100%;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    label {
      font-weight: 600;
      color: #163172;
      margin-bottom: 0.5rem;
      display: block;
    }

    input[type="text"],
    input[type="email"],
    textarea {
      padding: 0.75rem 1rem;
      border: 1.8px solid #d0d7ff;
      border-radius: 12px;
      font-size: 1.05rem;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #2b2b40;
      transition: border-color 0.3s ease;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    textarea:focus {
      border-color: #4158d0;
      outline: none;
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    button[type="submit"] {
      background-color: #4158d0;
      color: white;
      font-weight: 700;
      font-size: 1.1rem;
      padding: 0.9rem 1.5rem;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      align-self: center;
      width: 180px;
    }

    button[type="submit"]:hover {
      background-color: #2f40b5;
    }

    .form-note {
      font-size: 0.9rem;
      color: #6a7393;
      text-align: center;
    }

    @media (max-width: 480px) {
      .container {
        margin: 2rem 1rem 3rem;
        padding: 1.2rem 1rem;
      }

      button[type="submit"] {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="container" role="main" aria-label="Contact Form">
    <h1 class="section-title">Contact Us</h1>
    <form action="https://formspree.io/f/xandglke" method="POST" aria-describedby="form-note">
      <label for="name">Full Name <sup aria-label="required">*</sup></label>
      <input type="text" id="name" name="name" required placeholder="Your full name" />

      <label for="studentNumber">Student Number<span>*</span></label>
      <input type="text" id="studentNumber" name="studentNumber" pattern="\d{8}" title="Student number must be exactly 8 digits" required placeholder="Your 8 digit student number" maxlength="8" inputmode="numeric" />

      <label for="programBatch">Program and Batch<span>*</span></label>
      <input type="text" id="programBatch" name="programBatch" required placeholder="e.g. MBA Project Management, Sept 2025" />

      <label for="email">Email Address <sup aria-label="required">*</sup></label>
      <input type="email" id="email" name="email" required placeholder="studentNumber@dbs.ie" />

      <label for="message">Message <sup aria-label="required">*</sup></label>
      <textarea id="message" name="message" required placeholder="Write your motivation..."></textarea>

      <!-- Anti-spam honeypot -->
      <input type="text" name="_gotcha" style="display:none" />

      <!-- Optional redirect after submit -->
      <!-- <input type="hidden" name="_redirect" value="https://yourdomain.com/thank-you.html" /> -->

      <button type="submit" aria-label="Send Message">Send Message</button>
      <p id="form-note" class="form-note">Fields marked with <sup>*</sup> are required.</p>
    </form>
  </main>
</body>
</html>
